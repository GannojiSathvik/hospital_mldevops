# Internal-only Service (ClusterIP). Expose externally via an Ingress with TLS.
apiVersion: v1
kind: Service
metadata:
  name: readmission-api
  namespace: healthcare-readmission
  labels:
    app.kubernetes.io/name: readmission-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: readmission-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
