# `kubectl apply -k infrastructure/kubernetes/` applies these in order.
# secret.example.yaml is intentionally NOT listed — create the real Secret out-of-band.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - hpa.yaml
