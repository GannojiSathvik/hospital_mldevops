# =============================================================================
# Docker build -> scan -> SBOM -> publish -> sign (Lab 5: supply-chain security)
# -----------------------------------------------------------------------------
#   1. Build model artifacts (the image bakes in models/*.joblib, which are not
#      committed to git — they are DVC-tracked). In a real setup you would
#      `dvc pull` or download the approved model from the MLflow registry.
#   2. Build the image locally (not pushed yet).
#   3. Trivy image scan — FAILS the job on any CRITICAL CVE (exit-code 1), so a
#      vulnerable image is never published.
#   4. SBOM (Software Bill of Materials) in SPDX format via anchore/sbom-action
#      — an inventory of every package in the image, kept as an artifact.
#   5. On main / version tags only: push to GHCR (GitHub Container Registry).
#   6. Cosign keyless signing: the job's OIDC identity (id-token: write) gets a
#      short-lived certificate from Sigstore Fulcio; the signature is recorded
#      in the Rekor transparency log. No long-lived signing key to leak.
#      Verify with:
#        cosign verify ghcr.io/<owner>/healthcare-readmission-api@<digest> \
#          --certificate-identity-regexp 'https://github.com/<owner>/<repo>/.github/workflows/docker-publish.yml@.*' \
#          --certificate-oidc-issuer https://token.actions.githubusercontent.com
# =============================================================================
name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements-api.txt"
      - "api/**"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/healthcare-readmission-api
  LOCAL_TAG: healthcare-readmission-api:ci

jobs:
  build-scan-publish:
    name: Build, scan, SBOM, publish, sign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR (only used on main/tags)
      id-token: write # OIDC token for cosign keyless signing
      security-events: write # upload Trivy SARIF
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
      - name: Build model artifacts
        env:
          ENFORCE_PIPELINE_RBAC: "false"
          MLFLOW_TRACKING_URI: "sqlite:///mlflow.db"
        run: |
          pip install -r requirements.txt
          python -m scripts.generate_dataset
          python -m scripts.preprocess
          python -m pipelines.training_pipeline

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build image (local only, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.LOCAL_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan -> SARIF (informational, all severities)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ env.LOCAL_TAG }}
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
      - name: Upload Trivy image SARIF
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Trivy gate — FAIL on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ env.LOCAL_TAG }}
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.LOCAL_TAG }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 90

      # ---- Publish: only for main branch and version tags, never for PRs ----
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: true
          sbom: true

      - name: Install cosign
        if: steps.push.outcome == 'success'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, by digest)
        if: steps.push.outcome == 'success'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        # Sign the immutable digest, not a mutable tag.
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}
