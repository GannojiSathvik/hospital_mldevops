# =============================================================================
# Data validation (Lab 5 + Lab 6)
# -----------------------------------------------------------------------------
# Runs whenever data-generation / validation code or config changes. It
# regenerates the synthetic dataset and runs the validation pipeline, which
# checks: required columns, dtypes, allowed categories, missing-value limits,
# numeric ranges, duplicate patient IDs, schema changes, target distribution,
# class imbalance and leakage. A failed check exits non-zero -> job fails.
#
# RBAC note: pull requests from forks do NOT receive repository secrets, so a
# PR run cannot hold PIPELINE_API_KEY. PR runs therefore disable pipeline RBAC
# (ENFORCE_PIPELINE_RBAC=false); push/dispatch runs on main enforce it with the
# ml_engineer key, exactly like model-training.yml.
# =============================================================================
name: Data Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/generate_dataset.py"
      - "src/data/**"
      - "src/features/**"
      - "pipelines/validation_pipeline.py"
      - "configs/**"
      - "params.yaml"
      - "data/**.dvc"
  push:
    branches: [main]
    paths:
      - "scripts/generate_dataset.py"
      - "src/data/**"
      - "src/features/**"
      - "pipelines/validation_pipeline.py"
      - "configs/**"
      - "params.yaml"
      - "data/**.dvc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate dataset
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ENFORCE_PIPELINE_RBAC: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
      API_KEYS: ${{ secrets.API_KEYS }}
      PIPELINE_API_KEY: ${{ secrets.PIPELINE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate synthetic dataset
        run: python -m scripts.generate_dataset
      - name: Run validation pipeline
        run: python -m pipelines.validation_pipeline
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-validation-report
          path: |
            reports/validation/
            reports/*validation*
            logs/audit.log
          if-no-files-found: ignore
          retention-days: 14
