# Candidate models and their (small) hyperparameter search spaces.
# Each list is sampled by RandomizedSearchCV; keys are prefixed with
# "classifier__" automatically because the classifier is the last Pipeline step.
# Class imbalance: class_weight=balanced (LR, RF) and scale_pos_weight (XGBoost,
# set at runtime to n_negative / n_positive).
models:
  logistic_regression:
    params:
      C: [0.01, 0.03, 0.1, 0.3, 1.0, 3.0]
  random_forest:
    params:
      n_estimators: [150, 250]
      max_depth: [6, 8, 12, null]
      min_samples_leaf: [5, 10, 20]
      max_features: [sqrt, 0.5]
  xgboost:
    params:
      n_estimators: [150, 250, 400]
      max_depth: [2, 3, 4]
      learning_rate: [0.03, 0.05, 0.1]
      subsample: [0.8, 1.0]
      colsample_bytree: [0.7, 1.0]
      min_child_weight: [1, 5]

outlier_clipping:
  lower_quantile: 0.01
  upper_quantile: 0.99
