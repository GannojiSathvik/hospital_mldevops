# Structured (JSON) logging configuration for the API, loaded by api/logging_config.py
# with logging.config.dictConfig. JSON lines are easy for log shippers (Loki, ELK,
# CloudWatch) to parse, and every line carries the request_id so one request can be
# traced across log lines. Never log raw API keys, request bodies with PHI, or secrets.
version: 1
disable_existing_loggers: false

filters:
  request_id:
    (): api.logging_config.RequestIdFilter

formatters:
  json:
    (): pythonjsonlogger.json.JsonFormatter
    fmt: "%(asctime)s %(levelname)s %(name)s %(message)s %(request_id)s"
    rename_fields:
      asctime: timestamp
      levelname: level
      name: logger

handlers:
  console:
    class: logging.StreamHandler
    stream: ext://sys.stdout
    formatter: json
    filters: [request_id]

loggers:
  api:
    level: INFO
    handlers: [console]
    propagate: false
  uvicorn.access:
    level: WARNING   # our middleware logs each request already (with request_id)
    handlers: [console]
    propagate: false

root:
  level: INFO
  handlers: [console]
